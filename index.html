let md="quick",sel="all",L=[],i=0,sc=0,done=false,res={};
const $=id=>document.getElementById(id);
function setMd(m){md=m;start()}
function chips(){$("modes").innerHTML=[["quick","Soal Cepat"],["kasus","Studi Kasus"]].map(m=>`<button class="chip ${m[0]==md?"on":""}" onclick="setMd('${m[0]}')">${m[1]}</button>`).join("");$("chips").innerHTML=Object.keys(T).map(k=>`<button class="chip ${k==sel?"on":""}" onclick="pick('${k}')">${IC[k]} ${T[k][0]}</button>`).join("");$("rumt").textContent=T[sel][1]=="Semua topik"?Object.keys(T).slice(1).map(k=>T[k][0]+": "+T[k][1]).join("\n"):T[sel][1];$("rumt").style.whiteSpace="pre-wrap"}
function sh(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function pick(k){sel=k;start()}
function start(){const B=md=="kasus"?C.filter(c=>sel=="all"||c.t==sel).flatMap(c=>c.qs.map(q=>({...q,t:c.t,title:c.title,story:c.story,d:c.d}))):sh(Q.filter(x=>sel=="all"||x.t==sel));L=B.map(x=>({...x,os:sh(x.o.map((t,n)=>({t,c:n==x.a})))}));i=0;sc=0;res={};chips();show()}
function show(){done=false;if(i>=L.length)return fin();const x=L[i];
$("app").innerHTML=`<div class="bar"><i style="width:${i/L.length*100}%"></i></div><div class="card"><div class="tag">${IC[x.t]} ${T[x.t][0]} · Soal ${i+1}/${L.length}</div><div class="il">${IL[x.t]}</div>${x.story?`<div class="case"><b>📋 ${x.title}</b><br>${x.story}</div>`:""}<div class="q">${x.q}</div>${x.d?`<div class="d">${x.d}</div>`:""}${x.q2?`<div class="q">${x.q2}</div>`:""}${x.os.map((o,n)=>`<button class="o" onclick="ans(${n})"><b class="lt">${"ABCD"[n]}</b><span>${o.t}</span></button>`).join("")}<div id="fb"></div></div>`}
function ans(n){if(done)return;done=true;const x=L[i],ok=x.os[n].c;x.pick=n;x.ok=ok;if(ok)sc++;res[x.t]=res[x.t]||[0,0];res[x.t][1]++;if(ok)res[x.t][0]++;
document.querySelectorAll(".o").forEach((b,k)=>{b.disabled=true;if(x.os[k].c)b.classList.add("ok");else if(k==n)b.classList.add("no")});
$("fb").innerHTML=`<div class="ex"><b>${ok?"Benar! (+1)":"Belum tepat. (0)"}</b> Skor saat ini ${sc}/${i+1}. ${x.e}</div><button class="btn" onclick="i++;show()">${i+1<L.length?"Soal berikutnya":"Lihat hasil"}</button>`}
function ans(n){const x=L[i];x.pick=n;x.ok=x.os[n].c;document.querySelectorAll(".o").forEach((b,k)=>b.classList.toggle("sel",k==n));$("fb").innerHTML=`<button class="btn" onclick="nx()">${i+1<L.length?"Soal berikutnya":"Selesai dan lihat nilai"}</button>`}
function nx(){i++;show()}

};
const G=p=>p>=85?"A":p>=70?"B":p>=55?"C":p>=40?"D":"E";

function fin(){sc=L.filter(x=>x.ok).length;res={};L.forEach(x=>{res[x.t]=res[x.t]||[0,0];res[x.t][1]++;if(x.ok)res[x.t][0]++});const n=L.length,p=Math.round(sc/n*100),nm=$("nm").value.trim()||"(tanpa nama)",nim=$("nim").value.trim(),kl=$("kls").value.trim(),mm=(md=="kasus"?"Studi Kasus":"Soal Cepat")+" - "+T[sel][0],msg=p>=80?"Sangat baik.":p>=60?"Cukup baik, ulangi topik yang lemah.":"Perlu latihan lagi, pelajari ringkasan rumus.";
const rk=Object.keys(res).map(k=>`<div class="row"><span>${T[k][0]}</span><b>${res[k][0]}/${res[k][1]}</b></div>`).join("");
const rv=L.map((x,j)=>`<details><summary style="color:${x.ok?"var(--ok)":"var(--no)"}">${j+1}. ${T[x.t][0]} · ${x.ok?"Benar":"Salah"}</summary><div style="margin:6px 0;color:var(--tx)">${x.q}${x.q2?" "+x.q2:""}<br><b>Jawabanmu:</b> ${x.os[x.pick].t}<br><b>Kunci:</b> ${x.os.find(o=>o.c).t}<br><i>${x.e}</i></div></details>`).join("");
const tx=`Nama: ${nm}${nim?" ("+nim+")":""}${kl?"\nKelas: "+kl:""}\nLatihan Statistik TI - ${mm}\nNilai: ${p} (${G(p)}) | Benar ${sc}/${n}\n`+Object.keys(res).map(k=>`${T[k][0]}: ${res[k][0]}/${res[k][1]}`).join("\n");
$("app").innerHTML=`<div class="card"><div class="tag">Hasil koreksi · ${mm}</div><div style="margin:2px 0;font-weight:600">${nm}${nim?" · "+nim:""}${kl?" · Kelas "+kl:""}</div><div class="big">Nilai ${p} (${G(p)})</div><p class="s">Benar ${sc} dari ${n} soal, tiap soal ${(100/n).toFixed(1)} poin. ${msg}</p>${rk}</div><div class="card"><div class="tag" style="margin-bottom:6px">Koreksi per soal (ketuk untuk membuka)</div>${rv}</div><div class="card"><div class="tag" style="margin-bottom:6px">Salin hasil untuk dikirim ke dosen</div><textarea id="tx" rows="5" readonly>${tx}</textarea><button class="btn" onclick="cp()">Salin hasil</button> <button class="btn g" onclick="start()">Ulangi</button> <button class="btn g" onclick="pick('all')">Semua topik</button><span id="cpm" class="s"></span></div>`;window.scrollTo(0,0)}
function fin0(){const p=Math.round(sc/L.length*100);$("app").innerHTML=`<div class="card"><div class="tag">Hasil akhir</div><div class="big">${sc} / ${L.length} (${p}%)</div><p class="s">${p>=80?"Sangat baik, pemahamanmu sudah kuat.":p>=60?"Cukup baik, ulangi topik yang masih lemah.":"Perlu latihan lagi, pelajari ringkasan rumus lalu coba ulang."}</p>${Object.keys(res).map(k=>`<div class="row"><span>${T[k][0]}</span><b>${res[k][0]}/${res[k][1]}</b></div>`).join("")}<button class="btn" onclick="start()">Ulangi (soal diacak)</button> <button class="btn g" onclick="pick('all')">Semua topik</button></div>`}
